# Everything needed to run the cart service locally: `docker compose up --build`
#   cart     http://localhost:8081  (this service)
#   product  http://localhost:8080  (Target Item / Pricing / Availability services)
#   postgres localhost:5432         (cart storage)
#
# To run the cart from the IDE instead: `docker compose up -d postgres product`, then `./gradlew bootRun`.
name: retail-cart

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: retailcart
      POSTGRES_USER: retailcart
      POSTGRES_PASSWORD: retailcart # local only; production injects secrets (D28)
    ports:
      - "5432:5432"
    volumes:
      - cart-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retailcart -d retailcart"]
      interval: 5s
      timeout: 3s
      retries: 10

  product:
    image: ghcr.io/target/tech-case-studies/product:latest
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/product/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  cart:
    build: .
    image: retail-cart:local
    ports:
      - "8081:8081"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/retailcart
      DB_USERNAME: retailcart
      DB_PASSWORD: retailcart
      PRODUCT_SERVICE_URL: http://product:8080
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs # JSON logs with trace ids, for log shippers (D41)
    depends_on:
      postgres:
        condition: service_healthy # the cart can't start without its database
      product:
        condition: service_started # not healthy: the cart degrades without it (D11)

volumes:
  cart-data:
